<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Propriedades Intelectuais - IFSertãoPE</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #f3f6f4;
    }

    header {
        position: sticky;
        top: 0;
        z-index: 10;
        width: 100%;
        min-height: 72px;
        background: rgb(9 53 38 / 88%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
        backdrop-filter: blur(16px) saturate(140%);
        display: flex;
        align-items: center;
        padding: 14px clamp(20px, 5vw, 64px);
        color: #fff;
        border-bottom: 1px solid rgb(255 255 255 / 18%);
        box-shadow: 0 6px 24px rgb(10 35 26 / 18%);
    }

    .brand { display: flex; align-items: center; min-width: 0; }
    .brand-copy h1 {
        padding-left: 16px;
        border-left: 3px solid #d6aa45;
        font-size: clamp(17px, 2vw, 21px); font-weight: 650;
        line-height: 1.2; letter-spacing: -.02em;
    }

    @media (max-width: 560px) {
        header { min-height: 64px; padding-inline: 18px; }
        .brand-copy h1 { padding-left: 12px; }
    }

    .dashboard {
        position: relative;
        width: 100%;
        height: calc(100vh - 72px);
        background: #f3f6f4;
    }

    .loading-indicator {
        position: absolute;
        inset: 0;
        z-index: 1;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        color: #315b49;
        background: #f3f6f4;
        font-size: 14px;
        font-weight: 600;
        transition: opacity 220ms ease, visibility 220ms ease;
    }

    .loading-indicator.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .loading-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid #c9ded2;
        border-top-color: #08744a;
        border-radius: 50%;
        animation: spin 800ms linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    iframe {
        position: relative;
        z-index: 2;
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
    }

    @media (prefers-reduced-motion: reduce) {
        .loading-spinner { animation-duration: 2s; }
        .loading-indicator { transition: none; }
    }
</style>

</head>

<body>

<header>
    <div class="brand">
        <div class="brand-copy">
            <h1>Propriedades Intelectuais</h1>
        </div>
    </div>
</header>

<main class="dashboard">
    <div class="loading-indicator" id="loading-indicator" role="status" aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span>Carregando painel...</span>
    </div>
    <iframe
        src="https://datastudio.google.com/embed/reporting/e5b70244-817f-4a18-a795-e5b8efe70f67/page/LpK8F"
        title="Painel de Propriedades Intelectuais"
        allowfullscreen
        onload="document.getElementById('loading-indicator').classList.add('is-hidden')">
    </iframe>
</main>

</body>
</html>
